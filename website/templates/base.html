<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <title>{% block title %}Password Security Checker{% endblock %}</title>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="{{ url_for('views.home') }}">Password<br>Security<br>Checker</a>
    <div class="nav">
      <a href="{{ url_for('views.checker') }}">Check Password Strength</a>
      <a href="{{ url_for('views.saved_passwords') }}">Saved Passwords</a>
      <a href="{{ url_for('views.help_page') }}">Help</a>
    </div>
  </div>
  <div class="page">{% block content %}{% endblock %}</div>
  {% block scripts %}{% endblock %}
</body>
</html>
