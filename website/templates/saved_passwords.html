{% extends "base.html" %}
{% block title %}Saved Passwords{% endblock %}
{% block content %}
<div class="toolbar">
  <div>
    <input type="text" id="search" placeholder="Search" oninput="render()" />
    <button class="tool-btn" onclick="toggleSortMenu()"><span class="dot">&#9881;</span>Sort</button>
    <div id="sortMenu" class="sort-menu" hidden>
      <button onclick="setSort('az')">A to Z</button>
      <button onclick="setSort('za')">Z to A</button>
      <button onclick="setSort('newest')">Newest first</button>
      <button onclick="setSort('oldest')">Oldest first</button>
    </div>
  </div>
  <div>
    <button class="tool-btn" onclick="openForm()"><span class="dot">+</span>Add</button>
    <button class="tool-btn" onclick="deleteSelected()"><span class="dot">&#8635;</span>Delete</button>
    <button class="tool-btn" onclick="editSelected()"><span class="dot">&#9998;</span>Edit</button>
  </div>
</div>

<div id="formPanel" class="panel form-panel" hidden>
  <h2 id="formTitle">Add a saved password</h2>
  <label>Site / App</label>
  <input type="text" id="fSite" />
  <label>Username</label>
  <input type="text" id="fUser" />
  <label>Password</label>
  <input type="password" id="fPass" />
  <label class="inline"><input type="checkbox" onchange="showPass(this, 'fPass')" /> Show password</label>
  <div class="form-actions">
    <button class="btn-primary" onclick="saveForm()">Save</button>
    <button class="btn-plain" onclick="closeForm()">Cancel</button>
  </div>
</div>

<div id="list"></div>

<div id="detail" class="panel detail" hidden></div>
{% endblock %}

{% block scripts %}
<script>
  const KEY = "savedPasswords";
  let items = load();
  let selectedId = null;
  let editingId = null;
  let sortMode = "az";

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  /* ---------- list ---------- */
  function render() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    let shown = items.filter(i => i.site.toLowerCase().includes(q));

    if (sortMode === "az") shown.sort((a, b) => a.site.localeCompare(b.site));
    if (sortMode === "za") shown.sort((a, b) => b.site.localeCompare(a.site));
    if (sortMode === "newest") shown.sort((a, b) => b.id - a.id);
    if (sortMode === "oldest") shown.sort((a, b) => a.id - b.id);

    const list = document.getElementById("list");
    list.innerHTML = "";
    if (shown.length === 0) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = items.length ? "No saved passwords match your search."
                                   : "Nothing saved yet. Click Add to save a password.";
      list.appendChild(p);
    }
    shown.forEach(i => {
      const d = document.createElement("div");
      d.className = "entry" + (i.id === selectedId ? " selected" : "");
      d.textContent = i.site;               // textContent keeps user input safe
      d.onclick = () => { selectedId = i.id; render(); };
      list.appendChild(d);
    });
    renderDetail();
  }

  function renderDetail() {
    const box = document.getElementById("detail");
    const item = items.find(i => i.id === selectedId);
    if (!item) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = "";
    const h = document.createElement("h2"); h.textContent = item.site;
    const u = document.createElement("p");
    u.innerHTML = "<b>Username:</b> "; u.append(item.username || "(none)");
    const p = document.createElement("p");
    p.innerHTML = "<b>Password:</b> ";
    const span = document.createElement("span");
    span.textContent = "\u2022".repeat(Math.max(item.password.length, 8));
    let visible = false;
    const eye = document.createElement("button");
    eye.className = "btn-plain"; eye.textContent = "\u{1F441} Show";
    eye.onclick = () => {
      visible = !visible;
      span.textContent = visible ? item.password : "\u2022".repeat(Math.max(item.password.length, 8));
      eye.textContent = visible ? "\u{1F441} Hide" : "\u{1F441} Show";
    };
    p.append(span, " ", eye);
    box.append(h, u, p);
  }

  /* ---------- sort ---------- */
  function toggleSortMenu() {
    const m = document.getElementById("sortMenu");
    m.hidden = !m.hidden;
  }
  function setSort(mode) {
    sortMode = mode;
    document.getElementById("sortMenu").hidden = true;
    render();
  }

  /* ---------- add / edit ---------- */
  function openForm(item, prefillPassword) {
    editingId = item ? item.id : null;
    document.getElementById("formTitle").textContent = item ? "Edit saved password" : "Add a saved password";
    document.getElementById("fSite").value = item ? item.site : "";
    document.getElementById("fUser").value = item ? item.username : "";
    document.getElementById("fPass").value = item ? item.password : (prefillPassword || "");
    document.getElementById("formPanel").hidden = false;
    document.getElementById("fSite").focus();
  }
  function closeForm() {
    document.getElementById("formPanel").hidden = true;
    editingId = null;
  }
  function saveForm() {
    const site = document.getElementById("fSite").value.trim();
    const username = document.getElementById("fUser").value.trim();
    const password = document.getElementById("fPass").value;
    if (!site || !password) { alert("Please enter a site/app name and a password."); return; }

    if (editingId !== null) {
      const item = items.find(i => i.id === editingId);
      Object.assign(item, { site, username, password });
    } else {
      const item = { id: Date.now(), site, username, password };
      items.push(item);
      selectedId = item.id;
    }
    persist();
    closeForm();
    render();
  }
  function editSelected() {
    const item = items.find(i => i.id === selectedId);
    if (!item) { alert("Click a saved password first, then press Edit."); return; }
    openForm(item);
  }
  function showPass(box, id) {
    document.getElementById(id).type = box.checked ? "text" : "password";
  }

  /* ---------- delete ---------- */
  function deleteSelected() {
    const item = items.find(i => i.id === selectedId);
    if (!item) { alert("Click a saved password first, then press Delete."); return; }
    if (!confirm('Are you sure you want to delete "' + item.site + '"?')) return;
    items = items.filter(i => i.id !== selectedId);
    selectedId = null;
    persist();
    render();
  }

  /* ---------- arriving from the Checker's "Save This Password" ---------- */
  render();
  let pending = null;
  try { pending = sessionStorage.getItem("pendingPassword"); } catch (e) {}
  if (pending) {
    sessionStorage.removeItem("pendingPassword");
    openForm(null, pending);
  }
</script>
{% endblock %}
